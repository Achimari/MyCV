name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mycv
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Built here rather than on the droplet: it has 961 MB of RAM and is
      # already running ComUni in production.
      - run: npm run build

      - name: Ship dist/ to the droplet
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '167.99.253.162 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGxqIrGWSP73Rd9+I3+ttndnNm8QCvUxkyuRoliUFEUE' > ~/.ssh/known_hosts
          # The key is pinned to /usr/local/sbin/mycv-deploy by a forced command,
          # which reads this tarball on stdin and refuses a payload with no
          # index.html before touching the live site.
          tar -cz -C dist . | ssh -i ~/.ssh/deploy_key -o BatchMode=yes root@167.99.253.162
