<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />

    <title>Achimari — стримы, музыка и разговоры</title>
    <meta
      name="description"
      content="Я Achimari. Стримлю на Twitch, обычно по вечерам: играю, болтаю с чатом, иногда беру гитару или читаю стихи. Анонсы эфиров заранее пишу в Telegram."
    />
    <meta name="robots" content="index, follow" />
    <!-- %SITE_URL% подставляет vite.config.ts из переменной SITE_URL (см. .env.example). -->
    <link rel="canonical" href="%SITE_URL%/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Achimari" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Achimari — стримы, музыка и разговоры" />
    <meta
      property="og:description"
      content="Стримлю на Twitch по вечерам: игры, чат, иногда гитара и стихи. Анонсы — в Telegram."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Сине-жёлтый портрет Achimari в круглых очках" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Achimari — стримы, музыка и разговоры" />
    <meta
      name="twitter:description"
      content="Стримлю на Twitch по вечерам: игры, чат, иногда гитара и стихи. Анонсы — в Telegram."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Сине-жёлтый портрет Achimari в круглых очках" />

    <!-- Только дисплейный шрифт заголовка героя: он определяет первый экран. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/alumni-sans-cyrillic.woff2"
      crossorigin
    />

    <style>
      html {
        background: #080808;
        color-scheme: dark;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #080808;
        color: #e7e1d5;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #boot b {
        font-size: clamp(2.5rem, 12vw, 5rem);
        letter-spacing: -0.03em;
        font-weight: 800;
        line-height: 1;
      }
      #boot span {
        font-size: 0.75rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #a7a7a7;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <b>Achimari</b>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
